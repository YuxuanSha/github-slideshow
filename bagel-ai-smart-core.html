<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bagel AI - 灵动核心</title>
    <style>
        /* ========== Design System - Smart Core Edition ========== */

        :root {
            /* Warm Color Palette */
            --color-warm-bg: #F9F7F5;
            --color-surface: #FFFFFF;
            --color-primary-text: #2C2C2E;
            --color-secondary-text: #8E8E93;

            /* Brand Colors - Cyan/Teal Theme (Iron Man Arc Reactor inspired) */
            --color-brand-primary: #00D9FF;
            --color-brand-secondary: #00FFA3;
            --color-brand-glow: rgba(0, 217, 255, 0.6);
            --color-brand-dim: rgba(0, 217, 255, 0.2);

            /* Accent Colors */
            --color-warning: #FF6B6B;
            --color-success: #00FFA3;

            /* Pastel Colors */
            --color-pastel-pink: #FFE5E0;
            --color-pastel-peach: #FFF3E0;
            --color-pastel-blue: #E8F4F8;
            --color-pastel-green: #E8F5E9;

            /* UI Elements */
            --color-tag-bg: #F2F0ED;
            --color-border: #E8E6E3;

            /* Shadows */
            --shadow-card: 0px 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-floating: 0px 8px 32px rgba(0, 217, 255, 0.15);
            --shadow-smart-core: 0px 0px 40px rgba(0, 217, 255, 0.4);

            /* Spacing */
            --spacing-xs: 8px;
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;

            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 28px;
            --radius-full: 100px;

            /* Typography */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        /* ========== Reset ========== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-warm-bg);
            color: var(--color-primary-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ========== Layout ========== */

        .app-container {
            max-width: 430px;
            margin: 0 auto;
            background-color: var(--color-warm-bg);
            min-height: 100vh;
            position: relative;
            padding-bottom: 140px;
        }

        .page {
            display: none;
            animation: fadeInPage 0.3s ease;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeInPage {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== Top Navigation Bar ========== */

        .top-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(249, 247, 245, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px var(--spacing-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--color-border);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-button {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--color-surface);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .menu-button:active {
            transform: scale(0.95);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .calendar-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: var(--color-surface);
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .calendar-button:active {
            transform: scale(0.95);
        }

        .calendar-icon {
            font-size: 20px;
        }

        .calendar-label {
            font-size: 10px;
            color: var(--color-secondary-text);
        }

        /* ========== Sidebar Drawer ========== */

        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 998;
            animation: fadeIn 0.3s;
        }

        .drawer-overlay.active {
            display: block;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background: var(--color-surface);
            z-index: 999;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.1);
        }

        .drawer.active {
            left: 0;
        }

        .drawer-header {
            padding: var(--spacing-xl) var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
        }

        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin-bottom: var(--spacing-sm);
        }

        .user-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .user-email {
            font-size: 14px;
            color: var(--color-secondary-text);
        }

        .drawer-menu {
            padding: var(--spacing-md) 0;
        }

        .drawer-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-lg);
            cursor: pointer;
            transition: background 0.2s;
        }

        .drawer-item:active {
            background: var(--color-warm-bg);
        }

        .drawer-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .drawer-text {
            font-size: 16px;
            font-weight: 500;
        }

        /* ========== Home Page ========== */

        .page-home {
            padding: var(--spacing-md);
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-secondary-text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--spacing-sm);
        }

        .daily-brief {
            margin-bottom: var(--spacing-lg);
        }

        .brief-scroll {
            display: flex;
            gap: var(--spacing-md);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 8px;
        }

        .brief-scroll::-webkit-scrollbar {
            display: none;
        }

        .brief-card {
            min-width: 300px;
            background: linear-gradient(135deg, var(--color-pastel-peach) 0%, var(--color-pastel-pink) 100%);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: var(--shadow-card);
        }

        .brief-card:active {
            transform: scale(0.98);
        }

        .brief-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
        }

        .brief-count {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-brand-primary);
            margin-bottom: var(--spacing-xs);
        }

        .brief-subtitle {
            font-size: 14px;
            color: var(--color-secondary-text);
        }

        .feed-section {
            margin-top: var(--spacing-lg);
        }

        .masonry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--spacing-md);
        }

        .masonry-item {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .masonry-item:active {
            transform: scale(0.98);
        }

        .masonry-image {
            width: 100%;
            aspect-ratio: 1 / 1.2;
            object-fit: cover;
            background: linear-gradient(135deg, var(--color-pastel-blue), var(--color-pastel-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .masonry-content {
            padding: var(--spacing-sm);
        }

        .masonry-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .masonry-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .masonry-tag {
            font-size: 11px;
            color: var(--color-brand-primary);
            background: rgba(0, 217, 255, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .masonry-time {
            font-size: 11px;
            color: var(--color-secondary-text);
        }

        /* ========== SMART CORE - The Super Button ========== */

        .smart-core-container {
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 150;
            pointer-events: none;
        }

        .smart-core-container > * {
            pointer-events: auto;
        }

        /* Base Smart Core */
        .smart-core {
            position: relative;
            width: 64px;
            height: 64px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Expanded Input Mode */
        .smart-core.expanded {
            width: 320px;
            height: 48px;
            border-radius: var(--radius-lg);
        }

        /* Recording Mode */
        .smart-core.recording {
            transform: scale(1.2);
        }

        /* Outer Ring - Glowing Border */
        .core-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--color-brand-primary);
            box-shadow:
                0 0 20px var(--color-brand-glow),
                inset 0 0 20px var(--color-brand-dim);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            animation: breathingGlow 3s ease-in-out infinite;
        }

        .smart-core.expanded .core-ring {
            border-radius: var(--radius-lg);
        }

        @keyframes breathingGlow {
            0%, 100% {
                box-shadow:
                    0 0 20px var(--color-brand-glow),
                    inset 0 0 20px var(--color-brand-dim);
                opacity: 1;
            }
            50% {
                box-shadow:
                    0 0 40px var(--color-brand-glow),
                    inset 0 0 30px rgba(0, 217, 255, 0.3);
                opacity: 0.8;
            }
        }

        /* Glass Background */
        .core-glass {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 217, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .smart-core.expanded .core-glass {
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.9);
        }

        /* Inner Core - Pulsing Light Point */
        .core-light {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, var(--color-brand-secondary), var(--color-brand-primary));
            box-shadow: 0 0 20px var(--color-brand-glow);
            animation: corePulse 2s ease-in-out infinite;
            transition: opacity 0.3s;
        }

        .smart-core.expanded .core-light {
            opacity: 0;
        }

        @keyframes corePulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0.6;
            }
        }

        /* Sound Wave Visualization */
        .sound-waves {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .smart-core.recording .sound-waves {
            display: flex;
        }

        .wave-bar {
            width: 3px;
            background: var(--color-brand-primary);
            border-radius: 2px;
            animation: waveAnimation 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 12px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 16px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 24px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 18px; animation-delay: 0.4s; }

        @keyframes waveAnimation {
            0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
            50% { transform: scaleY(1.5); opacity: 1; }
        }

        /* Text Input (Hidden by default) */
        .core-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 0 var(--spacing-md);
            font-size: 16px;
            font-family: var(--font-family);
            color: var(--color-primary-text);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .smart-core.expanded .core-input {
            opacity: 1;
            pointer-events: auto;
        }

        /* Gesture Hint Icons */
        .gesture-icons {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 430px;
            height: 100%;
            pointer-events: none;
            display: none;
            z-index: 149;
        }

        .gesture-icons.active {
            display: block;
        }

        .gesture-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            opacity: 0;
        }

        .gesture-icon.visible {
            opacity: 1;
        }

        .gesture-icon.active-hint {
            transform: scale(1.3);
            box-shadow: 0 0 30px var(--color-brand-glow);
        }

        .icon-left {
            left: 40px;
            bottom: 100px;
        }

        .icon-right {
            right: 40px;
            bottom: 100px;
        }

        .icon-up {
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 107, 107, 0.95);
        }

        .icon-up.visible {
            transform: translateX(-50%) translateY(0);
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--color-brand-glow), transparent);
            transform: scale(0);
            animation: rippleEffect 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Status Indicator */
        .status-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-lg);
            font-size: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 200;
        }

        .status-indicator.show {
            opacity: 1;
        }

        /* ========== Chatbot Page ========== */

        .page-chat {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--color-warm-bg);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
        }

        .back-button {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .chat-title {
            font-size: 17px;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            padding-bottom: 140px;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            word-wrap: break-word;
        }

        .message-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-bubble.ai {
            align-self: flex-start;
            background: var(--color-surface);
            color: var(--color-primary-text);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-card);
            display: flex;
            gap: 8px;
        }

        .ai-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-brand-primary), var(--color-brand-secondary));
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-secondary-text);
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }

        /* ========== Utility ========== */

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <div class="top-nav">
            <div class="nav-left">
                <button class="menu-button" id="menuButton">☰</button>
                <div class="logo">Bagel 🥯</div>
            </div>
            <div class="calendar-button" id="calendarButton">
                <div class="calendar-icon">📅</div>
                <div class="calendar-label">日历</div>
            </div>
        </div>

        <!-- Sidebar Drawer -->
        <div class="drawer-overlay" id="drawerOverlay"></div>
        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <div class="user-avatar">A</div>
                <div class="user-name">Alex Chen</div>
                <div class="user-email">alex@bagel.ai</div>
            </div>
            <div class="drawer-menu">
                <div class="drawer-item" data-page="page-profile">
                    <div class="drawer-icon">👤</div>
                    <div class="drawer-text">个人中心</div>
                </div>
                <div class="drawer-item" data-page="page-memory">
                    <div class="drawer-icon">🧠</div>
                    <div class="drawer-text">历史记忆</div>
                </div>
                <div class="drawer-item" data-page="page-connections">
                    <div class="drawer-icon">🔗</div>
                    <div class="drawer-text">数据连接</div>
                </div>
                <div class="drawer-item" data-page="page-settings">
                    <div class="drawer-icon">⚙️</div>
                    <div class="drawer-text">设置</div>
                </div>
            </div>
        </div>

        <!-- Page: Home -->
        <div id="page-home" class="page active">
            <div class="page-home">
                <section class="daily-brief">
                    <h2 class="section-title">今日重点</h2>
                    <div class="brief-scroll">
                        <div class="brief-card">
                            <div class="brief-title">📬 待处理消息</div>
                            <div class="brief-count">8</div>
                            <div class="brief-subtitle">3条高优先级 • 5条普通</div>
                        </div>
                        <div class="brief-card">
                            <div class="brief-title">📅 今日日程</div>
                            <div class="brief-count">5</div>
                            <div class="brief-subtitle">下一场会议 10:30</div>
                        </div>
                        <div class="brief-card">
                            <div class="brief-title">💡 待办事项</div>
                            <div class="brief-count">12</div>
                            <div class="brief-subtitle">3项今日截止</div>
                        </div>
                    </div>
                </section>

                <section class="feed-section">
                    <h2 class="section-title">发现</h2>
                    <div class="masonry-grid">
                        <div class="masonry-item">
                            <div class="masonry-image">💡</div>
                            <div class="masonry-content">
                                <div class="masonry-title">关于灵动核心的设计思考</div>
                                <div class="masonry-meta">
                                    <span class="masonry-tag">#产品灵感</span>
                                    <span class="masonry-time">刚刚</span>
                                </div>
                            </div>
                        </div>
                        <div class="masonry-item">

                            <div class="masonry-image">🎯</div>
                            <div class="masonry-content">
                                <div class="masonry-title">流体变形动画技术方案</div>
                                <div class="masonry-meta">
                                    <span class="masonry-tag">#技术</span>
                                    <span class="masonry-time">2小时前</span>
                                </div>
                            </div>

                        <div class="masonry-item">
                            <div class="masonry-image">✨</div>
                            <div class="masonry-content">
                                <div class="masonry-title">Siri球体动效分析</div>
                                <div class="masonry-meta">

        </div>

        <!-- Page: Chat -->
        <div id="page-chat" class="page">
            <div class="page-chat">
                <div class="chat-header">
                    <button class="back-button" id="chatBackButton">←</button>
                    <div class="chat-title">Bagel AI</div>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="message-bubble ai">
                        <div class="ai-avatar">🥯</div>
                        <div>你好！我是你的AI助手Bagel。试试新的灵动核心吧！</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Other Pages (Simplified) -->
        <div id="page-memory" class="page">
            <div class="page-home">
                <h2 style="font-size: 28px; font-weight: 600; margin: var(--spacing-lg);">历史记忆</h2>
            </div>
        </div>
        <div id="page-profile" class="page">
            <div class="page-home">
                <h2 style="font-size: 28px; font-weight: 600; margin: var(--spacing-lg);">个人中心</h2>
            </div>
        </div>
        <div id="page-connections" class="page">
            <div class="page-home">
                <h2 style="font-size: 28px; font-weight: 600; margin: var(--spacing-lg);">数据连接</h2>
            </div>
        </div>
        <div id="page-settings" class="page">
            <div class="page-home">
                <h2 style="font-size: 28px; font-weight: 600; margin: var(--spacing-lg);">设置</h2>
            </div>
        </div>

        <!-- ========== SMART CORE ========== -->
        <div class="smart-core-container">
            <div class="smart-core" id="smartCore">
                <div class="core-ring"></div>
                <div class="core-glass"></div>
                <div class="core-light"></div>
                <div class="sound-waves">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <input type="text" class="core-input" id="coreInput" placeholder="输入消息...">
            </div>
        </div>

        <!-- Gesture Hint Icons -->
        <div class="gesture-icons" id="gestureIcons">
            <div class="gesture-icon icon-left" id="iconLeft">📷</div>
            <div class="gesture-icon icon-right" id="iconRight">🔒</div>
            <div class="gesture-icon icon-up" id="iconUp">🗑️</div>
        </div>

        <!-- Status Indicator -->
        <div class="status-indicator" id="statusIndicator"></div>
    </div>

    <script>
        // ========== Global State ==========
        let isRecording = false;
        let isExpanded = false;
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let longPressTimer = null;
        let currentGesture = null;

        const LONG_PRESS_DURATION = 500;
        const SWIPE_THRESHOLD = 60;

        // ========== DOM Elements ==========
        const smartCore = document.getElementById('smartCore');
        const coreInput = document.getElementById('coreInput');
        const gestureIcons = document.getElementById('gestureIcons');
        const iconLeft = document.getElementById('iconLeft');
        const iconRight = document.getElementById('iconRight');
        const iconUp = document.getElementById('iconUp');
        const statusIndicator = document.getElementById('statusIndicator');
        const menuButton = document.getElementById('menuButton');
        const drawer = document.getElementById('drawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const chatMessages = document.getElementById('chatMessages');
        const chatBackButton = document.getElementById('chatBackButton');

        // ========== Navigation ==========
        menuButton.addEventListener('click', () => {
            drawer.classList.add('active');
            drawerOverlay.classList.add('active');
        });

        drawerOverlay.addEventListener('click', () => {
            drawer.classList.remove('active');
            drawerOverlay.classList.remove('active');
        });

        document.querySelectorAll('.drawer-item').forEach(item => {
            item.addEventListener('click', () => {
                const targetPage = item.getAttribute('data-page');
                navigateTo(targetPage);
                drawer.classList.remove('active');
                drawerOverlay.classList.remove('active');
            });
        });

        chatBackButton.addEventListener('click', () => {
            navigateTo('page-home');
        });

        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // ========== Smart Core Interactions ==========

        // Desktop Click - Toggle Input
        smartCore.addEventListener('click', (e) => {
            if (e.target === coreInput) return;

            if (!isExpanded && !isRecording) {
                expandToInput();
            }
        });

        // Touch Events
        smartCore.addEventListener('touchstart', handleTouchStart, { passive: false });
        smartCore.addEventListener('touchmove', handleTouchMove, { passive: false });
        smartCore.addEventListener('touchend', handleTouchEnd);
        smartCore.addEventListener('touchcancel', handleTouchEnd);

        function handleTouchStart(e) {
            if (e.target === coreInput) return;
            e.preventDefault();

            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
            currentGesture = null;

            // Create ripple effect
            createRipple(e.touches[0].clientX, e.touches[0].clientY);

            // Start long press timer
            longPressTimer = setTimeout(() => {
                startRecording();
            }, LONG_PRESS_DURATION);
        }

        function handleTouchMove(e) {
            if (!isRecording) return;

            const touchX = e.touches[0].clientX;
            const touchY = e.touches[0].clientY;
            const deltaX = touchX - touchStartX;
            const deltaY = touchStartY - touchY; // Inverted for upward

            // Show gesture icons
            gestureIcons.classList.add('active');
            iconLeft.classList.add('visible');
            iconRight.classList.add('visible');
            iconUp.classList.add('visible');

            // Detect gesture direction
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                // Horizontal swipe
                if (deltaX < -SWIPE_THRESHOLD) {
                    // Left swipe - Add image
                    currentGesture = 'image';
                    iconLeft.classList.add('active-hint');
                    iconRight.classList.remove('active-hint');
                    iconUp.classList.remove('active-hint');
                } else if (deltaX > SWIPE_THRESHOLD) {
                    // Right swipe - Lock recording
                    currentGesture = 'lock';
                    iconRight.classList.add('active-hint');
                    iconLeft.classList.remove('active-hint');
                    iconUp.classList.remove('active-hint');
                } else {
                    currentGesture = null;
                    iconLeft.classList.remove('active-hint');
                    iconRight.classList.remove('active-hint');
                }
            } else {
                // Vertical swipe
                if (deltaY > SWIPE_THRESHOLD) {
                    // Up swipe - Cancel
                    currentGesture = 'cancel';
                    iconUp.classList.add('active-hint');
                    iconLeft.classList.remove('active-hint');
                    iconRight.classList.remove('active-hint');
                } else {
                    if (currentGesture === 'cancel') {
                        currentGesture = null;
                        iconUp.classList.remove('active-hint');
                    }
                }
            }
        }

        function handleTouchEnd(e) {
            clearTimeout(longPressTimer);

            const touchDuration = Date.now() - touchStartTime;

            if (isRecording) {
                // Process gesture
                if (currentGesture === 'image') {
                    addImage();
                } else if (currentGesture === 'lock') {
                    lockRecording();
                } else if (currentGesture === 'cancel') {
                    cancelRecording();
                } else {
                    stopRecording();
                }

                // Reset
                gestureIcons.classList.remove('active');
                iconLeft.classList.remove('visible', 'active-hint');
                iconRight.classList.remove('visible', 'active-hint');
                iconUp.classList.remove('visible', 'active-hint');
            } else if (touchDuration < LONG_PRESS_DURATION) {
                // Quick tap - Expand to input
                expandToInput();
            }
        }

        // ========== Core Functions ==========

        function expandToInput() {
            isExpanded = true;
            smartCore.classList.add('expanded');
            setTimeout(() => {
                coreInput.focus();
            }, 400);
            vibrate(10);
        }

        function collapseFromInput() {
            isExpanded = false;
            smartCore.classList.remove('expanded');
            coreInput.blur();
            coreInput.value = '';
        }

        function startRecording() {
            isRecording = true;
            smartCore.classList.add('recording');
            vibrate(50);
            showStatus('正在录音...');
        }

        function stopRecording() {
            isRecording = false;
            smartCore.classList.remove('recording');
            hideStatus();

            // Send voice message
            setTimeout(() => {
                navigateTo('page-chat');
                addMessageToChat('user', '🎙️ [语音消息]');
                simulateAIResponse();
            }, 300);
        }

        function lockRecording() {
            isRecording = false;
            smartCore.classList.remove('recording');
            vibrate([30, 50, 30]);
            showStatus('录音已锁定，点击发送');

            setTimeout(() => {
                hideStatus();
            }, 2000);
        }

        function addImage() {
            isRecording = false;
            smartCore.classList.remove('recording');
            vibrate(30);

            navigateTo('page-chat');
            addMessageToChat('user', '📷 [图片]');
            simulateAIResponse();
        }

        function cancelRecording() {
            isRecording = false;
            smartCore.classList.remove('recording');
            vibrate([50, 100, 50]);
            showStatus('已取消');

            setTimeout(() => {
                hideStatus();
            }, 1000);
        }

        // ========== Input Handling ==========

        coreInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendTextMessage();
            }
        });

        coreInput.addEventListener('blur', () => {
            if (coreInput.value.trim() === '') {
                setTimeout(() => {
                    collapseFromInput();
                }, 200);
            }
        });

        function sendTextMessage() {
            const message = coreInput.value.trim();
            if (!message) return;

            navigateTo('page-chat');
            addMessageToChat('user', message);
            coreInput.value = '';
            collapseFromInput();
            simulateAIResponse();
        }

        // ========== Chat Functions ==========

        function addMessageToChat(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message-bubble ${type}`;

            if (type === 'ai') {
                messageDiv.innerHTML = `
                    <div class="ai-avatar">🥯</div>
                    <div>${content}</div>
                `;
            } else {
                messageDiv.textContent = content;
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function simulateAIResponse() {
            setTimeout(() => {
                showTypingIndicator();
                setTimeout(() => {
                    hideTypingIndicator();
                    addMessageToChat('ai', '收到！我已经记录下来了。灵动核心的交互体验如何？');
                }, 1500);
            }, 500);
        }

        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message-bubble ai';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `
                <div class="ai-avatar">🥯</div>
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // ========== Utility Functions ==========

        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';

            const rect = smartCore.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 2;

            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (x - rect.left - size / 2) + 'px';
            ripple.style.top = (y - rect.top - size / 2) + 'px';

            smartCore.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        function vibrate(pattern) {
            if ('vibrate' in navigator) {
                navigator.vibrate(pattern);
            }
        }

        function showStatus(message) {
            statusIndicator.textContent = message;
            statusIndicator.classList.add('show');
        }

        function hideStatus() {
            statusIndicator.classList.remove('show');
        }
    </script>
</body>
